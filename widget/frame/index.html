<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат с банком</title>
<!--
  Содержимое виджета (раздел 7.2 ТЗ).

  Стили здесь, а не в отдельном файле: окно маленькое, правил немного, а
  лишний запрос на медленном мобильном интернете виден глазом. Палитра и
  скругления — из прототипа (--rose #E8506B, --ink #110710), чтобы виджет
  на сайте банка и экран 03 в консоли выглядели одним продуктом.
-->
<style>
  :root {
    --ink: #110710; --panel: #1B0F19; --panel2: #241522; --raise: #2C1A29;
    --line: #3A2436; --paper: #F6EEF3; --muted: #B49AAC; --muted2: #7E6577;
    --rose: #E8506B; --rose-dim: #B33E55; --ok: #5FC79E; --brass: #DCA84C;
    --r: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink); color: var(--paper);
    font: 13px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 14px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .mark {
    width: 30px; height: 30px; border-radius: 9px; flex: 0 0 30px;
    background: var(--rose); display: grid; place-items: center;
    font-size: 12px; font-weight: 600;
  }
  .who { font-size: 13px; font-weight: 600; }
  .who small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 400; }
  .x {
    margin-left: auto; background: none; border: 0; color: var(--muted2);
    font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 6px;
  }
  .x:hover { color: var(--rose); }

  #log {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #log::-webkit-scrollbar { width: 5px; }
  #log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; }

  .m { max-width: 88%; padding: 9px 12px; border-radius: 13px; white-space: pre-wrap; }
  .m.user {
    align-self: flex-end; background: linear-gradient(135deg, var(--rose), var(--rose-dim));
    border-bottom-right-radius: 3px;
  }
  .m.bot {
    align-self: flex-start; background: var(--raise);
    border: 1px solid var(--line); border-bottom-left-radius: 3px;
  }
  .m.operator {
    align-self: flex-start; background: rgba(95,199,158,.1);
    border: 1px solid rgba(95,199,158,.3); border-bottom-left-radius: 3px;
  }
  .m.system {
    align-self: center; background: none; border: 1px dashed var(--line);
    color: var(--muted2); font-size: 10.5px; padding: 6px 12px; border-radius: 99px;
    text-align: center;
  }
  .from {
    display: block; font-size: 9.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ok); margin-bottom: 3px;
  }

  /* Бейджи источников: в Telegram это строка-футер, здесь — кликабельные
     номера с подсказкой «документ, страница». Требование раздела 6. */
  .src { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .src a, .src span {
    font-size: 10px; padding: 2px 7px; border-radius: 99px;
    border: 1px solid var(--line); background: var(--panel2);
    color: var(--muted); text-decoration: none; cursor: default;
  }
  .src a { cursor: pointer; }
  .src a:hover { border-color: var(--rose-dim); color: var(--paper); }

  /* Оценка работы оператора после закрытия диалога. Живёт в ленте
     системной репликой: это часть разговора, а не отдельный экран. */
  .rate { max-width: 100%; }
  .raterow { display: flex; gap: 4px; justify-content: center; margin-top: 8px; }
  .raterow .star {
    background: none; border: 0; padding: 2px 3px; cursor: pointer;
    font-size: 21px; line-height: 1; color: var(--line);
    transition: color .12s, transform .12s;
  }
  /* Подсвечиваются все звёзды до наведённой: человек ставит «четыре», а
     не «четвёртую». Класс вешает widget.js — на CSS такое не выразить. */
  .raterow .star.lit { color: var(--brass, #DCA84C); transform: scale(1.08); }

  .dots span {
    display: inline-block; width: 5px; height: 5px; margin-right: 3px;
    border-radius: 50%; background: var(--muted2); animation: blink 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 12px 12px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 96px; min-height: 38px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 11px;
    color: var(--paper); font: inherit; padding: 9px 11px;
  }
  textarea:focus { outline: none; border-color: var(--rose-dim); }
  .send {
    width: 38px; height: 38px; flex: 0 0 38px; border: 0; border-radius: 11px;
    background: var(--rose); color: #fff; cursor: pointer; font-size: 16px;
  }
  .send:disabled { opacity: .45; cursor: default; }

  .tg {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; margin-top: 9px; padding: 7px; cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 10px;
    color: var(--muted); font: inherit; font-size: 11.5px;
  }
  .tg:hover { border-color: #2AABEE; color: var(--paper); }

  /* Пустое состояние: виджет открыли и молчат. Показать пустую ленту —
     значит заставить человека гадать, что сюда писать; отсюда две
     подсказки-вопроса, которые он может нажать вместо набора текста. */
  .empty { margin: auto; padding: 22px 18px; text-align: center; }
  .empty h2 {
    font-size: 14px; font-weight: 600; margin: 0 0 6px;
  }
  .empty p { font-size: 12px; color: var(--muted); margin: 0 0 14px; line-height: 1.6; }
  .asks { display: flex; flex-direction: column; gap: 7px; }
  .asks button {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--paper); font: inherit; font-size: 12px; text-align: left;
    padding: 9px 12px; cursor: pointer;
  }
  .asks button:hover { border-color: var(--rose-dim); }

  /* МОБИЛЬНАЯ ВЁРСТКА. На телефоне окно занимает экран целиком (это
     решает loader.js), а внутри меняется немногое: крупнее шрифт ввода и
     плотнее отступы.

     16px у textarea — не вкусовщина: iOS Safari масштабирует страницу
     при фокусе на поле со шрифтом меньше 16px, и виджет «прыгает» в
     момент, когда человек собрался печатать. */
  @media (max-width: 560px) {
    body { font-size: 14px; }
    header { padding: 14px 14px calc(14px + env(safe-area-inset-top)); }
    #log { padding: 12px; gap: 9px; }
    .m { max-width: 92%; }
    footer {
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    }
    textarea { font-size: 16px; min-height: 42px; }
    .send { width: 42px; height: 42px; flex: 0 0 42px; }
    .x { font-size: 26px; padding: 4px 10px; }
  }
</style>
</head>
<body>
  <header>
    <div class="mark">Э</div>
    <div class="who">Банк Эсхата<small>отвечает по документам банка</small></div>
    <button class="x" id="close" title="Свернуть">×</button>
  </header>

  <div id="log"></div>

  <footer>
    <div class="row">
      <textarea id="text" rows="1" placeholder="Саволатонро нависед…"></textarea>
      <button class="send" id="send" title="Отправить">➤</button>
    </div>
    <button class="tg" id="tg">Продолжить в Telegram</button>
  </footer>

  <script src="widget.js"></script>
</body>
</html>
