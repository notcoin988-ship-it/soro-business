[project]
name = "soro-business-backend"
version = "1.0.0"
description = "Soro Business Console — бэкенд омниканальной платформы клиентского сервиса"
requires-python = "==3.11.*"

# Состав строго по таблице 2.2 ТЗ «Стек — зафиксирован, не обсуждается».
# Новая библиотека вне этого списка — только через тимлида (правило 10.1).
dependencies = [
    # веб-фреймворк
    "fastapi==0.111.*",
    "uvicorn[standard]>=0.30,<0.31",
    "python-multipart>=0.0.9",        # multipart-загрузка файлов, раздел 6.1
    "itsdangerous>=2.2",              # подписанная сессионная cookie, раздел 9

    # БД
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",                # тип VECTOR для SQLAlchemy
    "alembic>=1.13",
    "pydantic-settings>=2.2",

    # очередь
    "redis>=5.0",
    "rq==1.16.*",

    # HTTP-клиент (Soro API, TEI, WhatsApp, краулер)
    "httpx>=0.27",

    # каналы
    "aiogram==3.7.*",

    # ingest
    "pymupdf>=1.24",                  # PDF
    "python-docx>=1.1",               # DOCX
    "openpyxl>=3.1",                  # XLSX
    "selectolax>=0.3.21",             # HTML
    "pytesseract>=0.3.10",            # OCR-ветка
    "pillow>=10.3",                   # рендер страницы PDF в картинку для OCR
    "transformers>=4.41",             # AutoTokenizer BAAI/bge-m3 для чанкинга
    "pyyaml>=6.0",                    # tests/golden.yaml
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
