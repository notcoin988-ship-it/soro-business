services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: soro
      POSTGRES_PASSWORD: soro
      POSTGRES_DB: soro
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    ports: [ "5432:5432" ]

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]

  embeddings:
    # ОТКЛОНЕНИЕ ОТ ТЗ (раздел 3.3): в документе зафиксирован тег cpu-1.5.
    # Он нерабочий: внутри hf-hub 0.3.2, а Hugging Face сейчас отвечает на
    # /resolve/main/ редиректом 307 с ОТНОСИТЕЛЬНЫМ Location. Старая библиотека
    # такое не разбирает и падает с «relative URL without a base», модель не
    # скачивается вообще. Требует решения тимлида: оставить cpu-latest или
    # подложить веса bge-m3 в volume вручную, сохранив исходный тег.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id BAAI/bge-m3 --max-batch-tokens 16384
    ports: [ "8080:80" ]
    volumes: [ "teidata:/data" ]
    # на сервере с GPU заменить образ на ...:1.5 (cuda) — станет в ~20x быстрее

  # ДОБАВЛЕНО СВЕРХ ТЗ (согласовано с тимлидом): переранкер.
  #
  # ЗАЧЕМ. bge-m3 даёт РАЗНУЮ ШКАЛУ близости для разных языков: русская
  # пара «вопрос-документ» набирает 0,69–0,71, таджикская при таком же
  # качестве совпадения — 0,54–0,55. Единый порог 6.4 отсекает таджикский
  # как класс, а демо построено именно на нём. Безразмерные признаки
  # (отрыв топ-1 от остальных) проверены на golden set и оказались хуже
  # абсолютной близости — см. ARCHITECTURE.md.
  #
  # Кросс-энкодер читает вопрос и фрагмент ВМЕСТЕ и выдаёт откалиброванную
  # оценку; он для того и сделан, чтобы чинить эту слабость эмбеддингов.
  # Отдельной библиотеки не требуется: тот же TEI умеет ранжирование.
  #
  # Память: держим маленький батч — переранжируем всего RAG_TOP_K коротких
  # пар, а на этой машине WSL уже дважды умирал от прогрева TEI.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id BAAI/bge-reranker-v2-m3 --max-batch-tokens 4096
    ports: [ "8081:80" ]
    volumes: [ "rerankdata:/data" ]

  backend:
    build: ./backend
    env_file: .env
    depends_on: [ db, redis, embeddings ]
    ports: [ "8000:8000" ]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # ОТКЛОНЕНИЕ ОТ ТЗ (неделя 2): ./scripts смонтирован в контейнер, иначе
    # scripts/bench_index.py и scripts/eval_rag.py негде запускать — все
    # зависимости стоят только внутри образа. По той же причине смонтирован
    # ./tests: eval_rag.py читает golden.yaml, а он лежит в корне проекта.
    volumes:
      - "./backend:/code"
      - "./scripts:/code/scripts"
      - "./tests:/code/tests"
      # Файлы виджета (раздел 7.2): бэкенд отдаёт loader.js по /w.js и
      # содержимое iframe по /widget/frame. Отдельного CDN у демо нет.
      - "./widget:/code/widget"
      # Собранная консоль: бэкенд отдаёт её по /console, чтобы фронт и API
      # жили на одном адресе — см. комментарий к CONSOLE_DIR в main.py.
      - "./console/dist:/code/console_dist"
      - "uploads:/data/uploads"

  worker:
    build: ./backend
    env_file: .env
    depends_on: [ db, redis, embeddings ]
    command: rq worker ingest --url redis://redis:6379/0
    volumes: [ "./backend:/code", "uploads:/data/uploads" ]

volumes: { pgdata: {}, teidata: {}, rerankdata: {}, uploads: {} }
