  must_contain: бессрочный
- question: Мӯҳлати пасандози мӯҳлатнок чанд рӯз аст?
  expect: answer
  must_contain: "731"
- question: Какая ставка по срочному депозиту в сомони на срок больше года?
  expect: answer
  must_contain: "15%"
- question: Какая ставка по срочному депозиту в сомони на 180-365 дней?
  expect: answer
  must_contain: "12%"
