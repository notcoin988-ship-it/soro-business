# Golden set — эталонный набор вопросов (раздел 3.1 ТЗ).
#
# СТАТУС: ЧЕРНОВИК. Составлен мной по реальному содержимому сайта банка
# (боевой обход 149 страниц). По ТЗ вопросы
# собираются с менеджером по продажам — этот файл нужен, чтобы ему было что
# править, а не сочинять с нуля, и чтобы eval_rag.py было на чём запускать
# уже сейчас.
#
# Что обязательно проверить менеджеру:
#   1. так ли спрашивают клиенты (здесь формулировки «книжные»);
#   2. не устарели ли ставки и суммы — они взяты с сайта 5 августа 2026;
#   3. хватает ли вопросов на таджикском — здесь их 8 из 60, и это мало:
#      демо строится на таджикском вопросе, а таджикского текста в документах
#      банка почти нет. Добирать вопросы имеет смысл
#      только вместе с решением, откуда возьмётся таджикский материал.
#
# Формат:
#   expect: answer   — ответ есть в документах, бот обязан его найти
#   expect: escalate — ответа нет, бот обязан передать оператору
#   must_contain     — подстрока, без которой ответ считается неверным
#
# Пропорция по ТЗ: 40 answer + 20 escalate.
# ФАКТ после прогона 07.08.2026: 41 + 19. Вопрос про вклад в евро переехал
# из группы Б в группу А — оказалось, ответ в документах есть (см. ниже).
# Восстанавливать пропорцию выдуманным вопросом не стал: набор ценен тем,
# что отражает документы банка, а не арифметикой.
#
# ВАЖНО про must_contain: значения взяты из текста сайта дословно. При первом
# же прогоне eval_rag.py сверить пробелы и разделители («35 000» против
# «35000», «15,5» против «15.5») — расхождение здесь даст ложные промахи.

# ---------------------------------------------------------------------------
# ГРУППА А — 40 вопросов, ответ на которые в документах ЕСТЬ
# ---------------------------------------------------------------------------

# --- вклады и депозиты ---
