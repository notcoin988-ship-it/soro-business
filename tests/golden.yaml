  must_contain: "60"
- question: Фоизи депозити онлайни «Фоиданок» чанд аст?
  expect: answer
  must_contain: "15,5"
- question: В каких валютах открывается депозит Фоиданок?
  expect: answer
  must_contain: USD
- question: Какая ставка по вкладу «30 солагии Истиклолият»?
  expect: answer
  must_contain: "15%"
- question: Маблағи ҳадди ақали пасандози «30 солагии Истиклолият» чанд аст?
  expect: answer
  must_contain: "50 000"
- question: На сколько дней открывается вклад 30 солагии Истиклолият?
